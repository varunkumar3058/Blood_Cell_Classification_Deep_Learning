<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        /* Apply background image */
        body {
            background: url('{{ url_for('static', filename='bg.webp') }}') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        /* Center the content */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.7); /* Transparent background for better text readability */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        img {
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Result</h1>

        <p>Uploaded Image:</p>
        <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="Uploaded Image" width="300px">

        <h2>Class Prediction</h2>
        <p>Predicted Class: <strong>{{ prediction }}</strong></p>
        <p>Confidence: <strong>{{ confidence }}%</strong></p>

        <a href="{{ url_for('index') }}">Upload Another Image</a>
    </div>
</body>
</html>
